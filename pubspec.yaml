name: cashflow_rs
description: "A hybrid offline-first personal cashflow management app for RS."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  drift: ^2.24.2
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.0
  fl_chart: ^0.70.2
  intl: ^0.20.2
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  uuid: ^4.5.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.24.2
  build_runner: ^2.4.14

flutter:
  uses-material-design: true

  assets:
    - assets/images/
